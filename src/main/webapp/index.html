<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILAHI Computer Center – Common Service Center</title><link rel="stylesheet" href="style.css?v=9"><link rel="stylesheet" href="home.css?v=9"></head><body>
<section id="home"><img src="main.png?v=9" alt="ILAHI Computer Center – Common Service Center"><a id="bHome" class="hs" role="button" tabindex="0" aria-label="Home" style="left:3.91%;top:15.43%;width:13.80%;height:5.96%"></a><a id="bSvc" class="hs" role="button" tabindex="0" aria-label="Service" style="left:20.18%;top:15.43%;width:11.07%;height:5.96%"></a><a id="bLogin" class="hs" role="button" tabindex="0" aria-label="Sign up" style="left:83.98%;top:15.43%;width:9.77%;height:5.96%"></a><a id="uL" class="hs" role="button" tabindex="0" aria-label="User Login" style="left:75.78%;top:32.62%;width:20.57%;height:5.96%"></a><a id="aL" class="hs" role="button" tabindex="0" aria-label="Admin Login" style="left:75.78%;top:40.23%;width:20.57%;height:5.96%"></a></section>

<section id="auth" hidden><div class="grid"><form class="card" id="fLogin"><h3>Login</h3><label>Mobile / Username</label><input name="mobile" required><label>Password</label><input name="password" type="password" required><button>Login</button></form>
<form class="card" id="fReg"><h3>New User? Sign up</h3><label>Full Name</label><input name="name" required><label>Mobile (10 digit)</label><input name="mobile" pattern="\d{10}" required><label>Email (optional)</label><input name="email" type="email"><label>Password (min 6)</label><input name="password" type="password" minlength="6" required><button>Create account</button></form></div></section>

<section id="user" hidden><h2>Services</h2><div class="grid" id="svc"></div>
<h2>My Applications</h2><div class="card"><input id="trk" placeholder="Application ID se track karein (ILC-2026-xxxxxx)" style="max-width:380px"> <button onclick="loadUser(trk.value)">Track</button></div><br><div class="tw"><table><thead><tr><th>Application ID</th><th>Service</th><th>Applied On</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="mine"></tbody></table></div></section>

<section id="admin" hidden><h2>Admin Dashboard</h2><div class="stats" id="stats"></div><h3>Application Management</h3><div class="tw"><table><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Details</th><th>Doc</th><th>Status</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table></div></section>

<dialog id="dlg"><form id="fApply"><h3 id="dT"></h3><input type="hidden" name="serviceId"><label>Details (jaise puraana / naya naam, DOB)</label><textarea name="details" rows="4" required></textarea><label>Document (JPG/PNG/PDF, max 2MB)</label><input type="file" name="file" accept=".jpg,.jpeg,.png,.pdf"><label><input type="checkbox" required style="width:auto"> Main ghoshit karta/karti hoon ki jaankari sahi hai.</label><br><br><button>Submit Application</button> <button type="button" class="ghost" onclick="dlg.close()">Cancel</button></form></dialog>
<div id="toast" hidden></div>
<div id="bar" hidden><button class="ghost" onclick="boot()">Home</button> <span id="who"></span> <button id="bOut" hidden>Logout</button></div><div id="pubServices" hidden></div>
<script src="app.js?v=9"></script>
<script>
const _show=show;show=function(id){_show(id);document.getElementById('bar').hidden=(id==='home')};
function goLogin(a){show('auth');const i=document.querySelector('#fLogin [name=mobile]');i.placeholder=a?'admin':'10 digit mobile';i.focus()}
uL.onclick=()=>goLogin(0);aL.onclick=()=>goLogin(1);bSvc.onclick=()=>goLogin(0);
document.querySelectorAll('.hs').forEach(e=>e.onkeydown=k=>{if(k.key==='Enter')e.click()});
</script></body></html>
